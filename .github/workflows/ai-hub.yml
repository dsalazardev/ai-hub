name: ai-hub

on:
  push:
    branches:
      - main
      # Evidencia de plataforma del change en curso (harden-harness-orchestration 3.23, 5.10).
      - codex/harden-harness-orchestration
  workflow_dispatch:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json

      # La suite y el smoke ejecutan Spec Kit real con uvx (specify-cli fijado por el paquete).
      - uses: astral-sh/setup-uv@v6

      - name: Spec Kit prerequisites (uvx and an executable bash)
        run: |
          uvx --version
          bash -c 'echo ok'

      - name: Install
        run: npm ci --prefix core

      - name: Build
        run: npm run ai:build

      - name: Test (includes the coupling gate)
        run: npm run ai:test

      - name: Manifest inventory is current
        run: npm run manifest:check

      - name: Doctor
        run: npm run ai:doctor

      - name: Full installation smoke
        run: |
          tmp="$(mktemp -d)"
          cd "$tmp"
          printf '{"name":"ci","devDependencies":{"typescript":"^5.0.0"}}\n' > package.json
          node "$GITHUB_WORKSPACE/core/dist/bin/ai-hub.js" init --yes
          node "$GITHUB_WORKSPACE/core/dist/bin/ai-hub.js" doctor
          node "$GITHUB_WORKSPACE/core/dist/bin/ai-hub.js" drift
          node "$GITHUB_WORKSPACE/core/dist/bin/ai-hub.js" sync --check-lock

  # harden-harness-orchestration 3.23 y 5.10: la captura con detección posterior (R-105, 1.16), el modo 700 del
  # almacenamiento privado y la cancelación del árbol de procesos se verifican en cada sistema. Una ejecución en
  # Windows no demuestra permisos POSIX: las pruebas POSIX solo corren (y solo cuentan) en Linux.
  platform-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: npm ci --prefix core

      # Sin secretos ni tracker: solo directorios temporales y procesos `node` propios.
      - name: Writes, capture, process tree and platform skips
        working-directory: core
        run: >-
          npx vitest run tests/writes.test.ts tests/writer-gate.test.ts tests/runner.test.ts
          tests/runner-integration.test.ts tests/sync.test.ts tests/idea-input-e2e.test.ts tests/cli.test.ts
          tests/idea-input-pty.test.ts --maxWorkers=1
          --reporter=default --reporter=junit --outputFile.junit=platform-evidence.xml

      # Una omisión nunca cuenta como aprobada: en Linux las pruebas POSIX deben haber corrido.
      - name: POSIX tests ran on Linux
        if: runner.os == 'Linux'
        working-directory: core
        run: >-
          node scripts/ci/required-ran.mjs platform-evidence.xml
          "POSIX exige modo 700" "POSIX: dangling symlink" "read-only target (2.3, DEV-03, POSIX)"
          "al vencer el timeout no queda ningún proceso del árbol"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-evidence-${{ matrix.os }}
          path: core/platform-evidence.xml
