name: ai-hub

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: Install
        run: npm ci --prefix core

      - name: Build
        run: npm run ai:build

      - name: Test (includes the coupling gate)
        run: npm run ai:test

      - name: Manifest inventory is current
        run: npm run manifest:check

      - name: Doctor
        run: npm run ai:doctor

      - name: Full installation smoke
        run: |
          tmp="$(mktemp -d)"
          cd "$tmp"
          printf '{"name":"ci","devDependencies":{"typescript":"^5.0.0"}}\n' > package.json
          node "$GITHUB_WORKSPACE/core/dist/bin/ai-hub.js" init --yes
          node "$GITHUB_WORKSPACE/core/dist/bin/ai-hub.js" doctor
          node "$GITHUB_WORKSPACE/core/dist/bin/ai-hub.js" drift
          node "$GITHUB_WORKSPACE/core/dist/bin/ai-hub.js" sync --check-lock
