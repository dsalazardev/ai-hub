id: base
version: 1
description: Minimal harness for any repository, regardless of language or framework.
detect:
  files: []
  dependencies: []
stack:
  languages: []
  packageManager: npm
commands: {}
paths:
  source: []
  tests: []
  docs: []
policy:
  trunk: auto
  guardMode: shadow
  worktrees: true
  optOuts: []
rules:
  - rules/core.md
agents:
  publish:
    - narrator
    # Panel de refutación (A4): todo preset lo hereda; se despacha entre CONVERGED y ai::in-review.
    - refuter-correctness
    - refuter-security
    - refuter-tests
    - finding-verifier
skills:
  publish: []
