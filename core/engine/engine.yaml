# AI Hub Engine — invariants shared by every project.
# This file ships with @dsalazardev/ai-hub-cli and is never edited by a target project.
version: 2

roles:
  - id: prompt-explorer
    canonical: orchestrator
    derived: true
    description: Turns a vague request into a researchable question.
    can_modify: []
    cannot_modify:
      - '**'
    commands: []
    gate: none

  - id: spec-explorer
    canonical: explorer-domain
    derived: false
    description: Investigates the domain and produces verifiable findings.
    can_modify:
      - .planning/findings.md
      - .specify/assessments/**
    cannot_modify:
      - src/**
    commands:
      - assess-intake
      - assess-research
      - assess-define
      - assess-shape
      - assess-decide
    gate: none

  - id: reviewer-exploration
    canonical: orchestrator
    derived: true
    description: Confirms exploration is sufficient before authoring the spec.
    can_modify: []
    cannot_modify:
      - '**'
    commands: []
    gate: convergence >= 95 %

  - id: spec-author
    canonical: spec-author
    derived: false
    description: Authors requirements, design and tasks.
    can_modify:
      - .specify/**
      - .planning/**
    cannot_modify:
      - src/**
    commands:
      - constitution
      - specify
      - clarify
      - plan
      - checklist
      - tasks
      - analyze
    gate: spec complete with no open questions

  - id: implementer-frontend
    canonical: implementer-frontend
    derived: false
    description: Implements the frontend side of the approved change.
    can_modify:
      - src/**
    cannot_modify: []
    commands:
      - implement
      - bug-fix
    gate: frontend build and tests

  - id: implementer-backend
    canonical: implementer-backend
    derived: false
    description: Implements the backend side of the approved change.
    can_modify:
      - src/**
    cannot_modify: []
    commands:
      - implement
      - bug-fix
    gate: backend typecheck and tests

  - id: reviewer-architecture
    canonical: reviewer-architecture
    derived: false
    description: Reviews architecture, conventions and bug diagnosis.
    can_modify:
      - .planning/review_arch_*.md
    cannot_modify:
      - src/**
    commands:
      - converge
      - bug-assess
    gate: PASS / NEEDS_FIX / BLOCKED

  - id: reviewer-tests
    canonical: reviewer-tests
    derived: false
    description: Reviews coverage, traceability and test verdicts.
    can_modify:
      - .planning/review_tests_*.md
    cannot_modify:
      - src/**
    commands:
      - bug-test
    gate: coverage thresholds met

commands:
  - id: assess-intake
    name: /speckit-assess-intake
    lane: assessment
    artifacts: [intake.md]
    exit: [DONE, BLOCKED]
    role: spec-explorer
    speckit: speckit.assess.intake
  - id: assess-research
    name: /speckit-assess-research
    lane: assessment
    artifacts: [research.md]
    exit: [DONE, BLOCKED]
    role: spec-explorer
    speckit: speckit.assess.research
  - id: assess-define
    name: /speckit-assess-define
    lane: assessment
    artifacts: [problem.md]
    exit: [DONE, BLOCKED]
    role: spec-explorer
    speckit: speckit.assess.define
  - id: assess-shape
    name: /speckit-assess-shape
    lane: assessment
    artifacts: [concept.md]
    exit: [DONE, BLOCKED]
    role: spec-explorer
    speckit: speckit.assess.shape
  - id: assess-decide
    name: /speckit-assess-decide
    lane: assessment
    artifacts: [decision.md]
    exit: [GO, NEEDS_CLARIFICATION, KILL]
    role: spec-explorer
    speckit: speckit.assess.decide

  - id: constitution
    name: /speckit.constitution
    lane: feature
    artifacts: [constitution.md]
    exit: [DONE, BLOCKED]
    role: spec-author
    speckit: speckit.constitution
  - id: specify
    name: /speckit.specify
    lane: feature
    artifacts: [spec.md]
    exit: [DONE, BLOCKED]
    role: spec-author
    speckit: speckit.specify
  - id: clarify
    name: /speckit.clarify
    lane: feature
    artifacts: [spec.md]
    exit: [DONE, BLOCKED]
    role: spec-author
    speckit: speckit.clarify
  - id: plan
    name: /speckit.plan
    lane: feature
    artifacts: [plan.md]
    exit: [DONE, BLOCKED]
    role: spec-author
    speckit: speckit.plan
  - id: checklist
    name: /speckit.checklist
    lane: feature
    artifacts: [checklist.md]
    exit: [DONE, BLOCKED]
    role: spec-author
    speckit: speckit.checklist
  - id: tasks
    name: /speckit.tasks
    lane: feature
    artifacts: [tasks.md]
    exit: [DONE, BLOCKED]
    role: spec-author
    speckit: speckit.tasks
  - id: analyze
    name: /speckit.analyze
    lane: feature
    artifacts: [analysis.md]
    exit: [DONE, BLOCKED]
    role: spec-author
    speckit: speckit.analyze
  - id: implement
    name: /speckit.implement
    lane: feature
    artifacts: [codebase]
    exit: [DONE, BLOCKED]
    role: implementer-frontend
    co_roles: [implementer-backend]
    speckit: speckit.implement
  - id: converge
    name: /speckit.converge
    lane: feature
    artifacts: [convergence.md]
    exit: [CONVERGED, NEEDS_WORK]
    role: reviewer-architecture
    speckit: speckit.converge

  - id: bug-assess
    name: /speckit-bug-assess
    lane: bug
    artifacts: [assessment.md]
    exit: [VALID, NEEDS_REPRODUCTION, INVALID]
    role: reviewer-architecture
    speckit: speckit.bug.assess
  - id: bug-fix
    name: /speckit-bug-fix
    lane: bug
    artifacts: [fix.md]
    exit: [APPLIED, PARTIAL, NOT_APPLIED]
    role: implementer-backend
    co_roles: [implementer-frontend]
    speckit: speckit.bug.fix
  - id: bug-test
    name: /speckit-bug-test
    lane: bug
    artifacts: [test.md]
    exit: [VERIFIED, PARTIAL, FAILED]
    role: reviewer-tests
    speckit: speckit.bug.test

# Efecto de cada estado de salida sobre las etiquetas ai::* (tabla única, design D2.6).
# Ningún agente mueve una etiqueta: hermes-control aplica o propone el cambio y un humano confirma
# las propuestas de cierre (KILL, INVALID).
exit_effects:
  GO: mantiene ai::in-spec; Spec-Author empieza la autoría de la feature
  NEEDS_CLARIFICATION: mantiene ai::in-spec; se repite la etapa indicada
  KILL: propone ai::done; hermes-control propone el cierre y un humano lo confirma
  DONE: sin cambio de etiqueta; el artefacto declarado existe y el carril continúa
  BLOCKED: ai::blocked con motivo y evidencia
  CONVERGED: ai::in-review
  NEEDS_WORK: mantiene ai::in-dev; las tareas pendientes se añaden a tasks.md
  VALID: sin cambio de etiqueta; el bug pasa a bug-fix
  NEEDS_REPRODUCTION: ai::blocked; faltan datos para reproducir
  INVALID: propone ai::done; hermes-control propone el cierre y un humano lo confirma
  APPLIED: ai::in-review
  PARTIAL: mantiene ai::in-dev
  NOT_APPLIED: ai::blocked con motivo y evidencia
  VERIFIED: ai::done a través de la revisión
  FAILED: ai::blocked con motivo y evidencia

labels:
  - ai::todo
  - ai::in-spec
  - ai::spec-ready
  - ai::in-dev
  - ai::in-review
  - ai::done
  - ai::blocked

targets:
  - claude
  - opencode
  - pi
  - cursor
  - copilot

# Spec Kit: dependencia de runtime declarada por el paquete. Un proyecto solo puede
# restringirla desde el bloque `speckit` de manifest.yaml, nunca ampliarla.
# `supported` es la única fuente de versión: toda resolución usa el rango y toma la
# última estable dentro de él. El motor no declara pin exacto ni fecha de resolución.
speckit:
  package: specify-cli
  supported: '>=1.2.3 <1.3.0'
  script: sh
  extensions:
    assess: 1.0.1
    bug: 1.0.1
