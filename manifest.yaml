version: 2

project:
  id: ai-hub
  name: AI Hub

preset:
  id: generic-ts
  version: 1
  source: package

stack:
  languages:
    - typescript
  packageManager: npm

commands:
  install: npm ci --prefix core
  build: npm run ai:build
  test: npm run ai:test
  typecheck: npm run ai:typecheck
  lint: npm run ai:typecheck
  verify: npm run ai:test

paths:
  source:
    - core/src
  tests:
    - core/tests
  docs:
    - docs

targets:
  - claude
  - opencode
  - pi
  - cursor
  - copilot

policy:
  trunk: auto
  guardMode: shadow
  worktrees: true
  optOuts: []

